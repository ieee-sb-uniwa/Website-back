services:
  web:
    build:
      target: dev
    volumes:
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ./web
          target: /app

  silo:
    environment:
      - MINIO_BROWSER_REDIRECT_URL=http://${SERVER_NAME}:${TRAEFIK_PORT}/silo-console
      - MINIO_BROWSER=on
    labels:
      traefik.enable: "true"
      traefik.http.routers.silo-console.rule: "Host(`${SERVER_NAME}`) && (PathPrefix(`/silo-console`) || PathPrefix(`/minio-console`))"
      traefik.http.routers.silo-console.entrypoints: "web"
      traefik.http.routers.silo-console.service: "silo-console-svc"
      traefik.http.services.silo-console-svc.loadbalancer.server.port: "9001"
      traefik.http.routers.silo-console.middlewares: "strip-silo-console-prefix"
      traefik.http.middlewares.strip-silo-console-prefix.stripPrefix.prefixes: "/silo-console,/minio-console"
