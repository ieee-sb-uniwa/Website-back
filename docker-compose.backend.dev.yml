version: "3.8"

services:
  backend:
    build: .
    restart: always
    container_name: bun-elysia-app
    ports:
      - "3000:3000" # Map the app's internal port to the host
    env_file:
      - ./env_files/.env.development # Load environment variables from a file
    volumes:
      - /app/node_modules # Prevent node_modules from being overwritten
    working_dir: /app
    command: ["bun", "run", "dev"]
    develop:
      watch:
        - action: sync+restart
          path: src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
