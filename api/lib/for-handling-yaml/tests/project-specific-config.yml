# Array of endpoints for the API
endpoints:
  - endpoint: /api/users
    httpMethods:
      - GET
      # - POST
    description: Retrieve and create users
    authenticationRequired: true

  - endpoint: /api/users/{id}
    httpMethods:
      - GET
      # - PUT
      # - DELETE
    description: Retrieve, update, or delete a user by ID
    authenticationRequired: true

  - endpoint: /api/products
    httpMethods:
      - GET
      # - POST
    description: Retrieve and create products
    authenticationRequired: false

  - endpoint: /api/products/{id}
    httpMethods:
      - GET
      # - PUT
      # - DELETE
    description: Retrieve, update, or delete a product by ID
    authenticationRequired: false

# Array of allowed domains for CORS
corsAllowlist:
  - https://example.com
  - https://anotherdomain.com
  - http://localhost:3000 # Allow localhost for testing
