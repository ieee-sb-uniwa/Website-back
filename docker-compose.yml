version: "3.8"

services:
  app:
    build: .
    container_name: bun-elysia-app
    ports:
      - "3000:3000" # Map the app's internal port to the host
    environment:
      - NODE_ENV=development
    volumes:
      # - ./:/app # Mount your code directory into the container
      - /app/node_modules # Prevent node_modules from being overwritten
    command: ["bun", "run", "dev"] # Use --watch or --hot here
    develop:
      watch:
        - action: sync+restart
          path: src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
