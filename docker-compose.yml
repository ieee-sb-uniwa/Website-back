services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    command:
      - "--log.level=INFO"
      - "--api.dashboard=false"
      # Set to false so we can secure it with a router/auth
      - "--api.insecure=false"
      - "--ping=true"
      - "--ping.entrypoint=web"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      # Entrypoints
      - "--entrypoints.web.address=:80"
    ports:
      - "0.0.0.0:${TRAEFIK_PORT}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    labels:
      - "traefik.enable=true"
      # Create a router for the internal API/Dashboard on the web entrypoint
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/ping"]
      interval: 5s
      retries: 10
      start_period: 5s

  api:
    build: ./api
    restart: always
    container_name: bun-elysia-app
    environment:
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin
      - PUBLIC_FILES_URL=${PUBLIC_FILES_URL:-/files}
    command: ["bun", "run", "start"]
    volumes:
      - ./db-container/data:/app/db/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=(Host(`${SERVER_NAME}`) || Host(`traefik`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=5000"
      - "traefik.http.routers.api.middlewares=strip-api-prefix"
      - "traefik.http.middlewares.strip-api-prefix.stripPrefix.prefixes=/api"
    develop:
      watch:
        - action: sync+restart
          path: ./api
          target: /app
        - action: rebuild
          path: ./api/package.json
        - action: rebuild
          path: ./api/bun.lockb
    depends_on:
      mongo:
        condition: service_started
      traefik:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:5000/ping"]
      interval: 5s
      retries: 5
      timeout: 3s
      start_period: 10s

  mongo:
    build:
      context: ./db-container
    container_name: mongo
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    restart: always
    volumes:
      - web-mongo-data:/data/db

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_BROWSER=off
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`${SERVER_NAME}`) && PathPrefix(`/files`)"
      - "traefik.http.routers.minio-api.entrypoints=web"
      - "traefik.http.routers.minio-api.service=minio-api-svc"
      - "traefik.http.services.minio-api-svc.loadbalancer.server.port=9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio-init:
    container_name: minio-init
    build:
      context: ./minio
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    develop:
      watch:
        - action: rebuild
          path: ./minio

  web:
    container_name: web
    build:
      context: ./web
      args:
        NEXT_PUBLIC_IMAGES_STORAGE_URL: ${PUBLIC_FILES_URL:-/files}
    environment:
      - API_URL=${API_URL:-http://${SERVER_NAME}:${TRAEFIK_PORT}/api}
      - NEXT_PUBLIC_IMAGES_STORAGE_URL=${PUBLIC_FILES_URL:-/files}
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${SERVER_NAME}`) && PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  payload-cms:
    container_name: payload-cms
    build:
      context: ./payload-cms
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin
      - DATABASE_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - NEXT_PUBLIC_SERVER_URL=${CMS_URL:-http://localhost:${CMS_PORT:-3001}}
    ports:
      - "${CMS_PORT:-3001}:3000"
    volumes:
      - payload-media:/app/public/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.payload-cms.rule=(Host(`cms.${SERVER_NAME}`) || Host(`cms.localhost`))"
      - "traefik.http.routers.payload-cms.entrypoints=web"
      - "traefik.http.services.payload-cms.loadbalancer.server.port=3000"
    depends_on:
      mongo:
        condition: service_started
      traefik:
        condition: service_healthy

volumes:
  minio-data:
  web-mongo-data:
  payload-media:
