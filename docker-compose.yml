services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    command:
      - "--log.level=INFO"
      - "--api.dashboard=false"
      # Set to false so we can secure it with a router/auth
      - "--api.insecure=false"
      - "--ping=true"
      - "--ping.entrypoint=web"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      # Entrypoints
      - "--entrypoints.web.address=:80"
    ports:
      - "0.0.0.0:${TRAEFIK_PORT}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    labels:
      - "traefik.enable=true"
      # Create a router for the internal API/Dashboard on the web entrypoint
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/ping"]
      interval: 5s
      retries: 10
      start_period: 5s

  api:
    build: ./api
    restart: always
    container_name: bun-elysia-app
    environment:
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin
      - PUBLIC_FILES_URL=${PUBLIC_FILES_URL:-/files}
    command: ["bun", "run", "start"]
    volumes:
      - ./db-container/data:/app/db/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=(Host(`${SERVER_NAME}`) || Host(`traefik`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=5000"
      - "traefik.http.routers.api.middlewares=strip-api-prefix"
      - "traefik.http.middlewares.strip-api-prefix.stripPrefix.prefixes=/api"
    develop:
      watch:
        - action: sync+restart
          path: ./api
          target: /app
        - action: rebuild
          path: ./api/package.json
        - action: rebuild
          path: ./api/bun.lockb
    depends_on:
      mongo:
        condition: service_started
      traefik:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:5000/ping"]
      interval: 5s
      retries: 5
      timeout: 3s
      start_period: 10s

  mongo:
    build:
      context: ./db-container
    container_name: mongo
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    restart: always
    volumes:
      - web-mongo-data:/data/db

  versity:
    image: ghcr.io/versity/versitygw:v1.7.0
    container_name: versity
    restart: always

    environment:
      ROOT_ACCESS_KEY: ${S3_ROOT_ACCESS_KEY}
      ROOT_SECRET_KEY: ${S3_ROOT_SECRET_KEY}

      VGW_PORT: ":7070"
      VGW_WEBUI_PORT: ":8080"
      VGW_WEBUI_PATH_PREFIX: /storage
      VGW_IAM_DIR: /data/iam
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3

      VGW_ACCESS_LOG: stdout

    volumes:
      - ./versity/data/s3:/data/s3
      - ./versity/data/iam:/data/iam

    labels:
      - "traefik.enable=true"

      # S3 API: s3.example.com
      - "traefik.http.routers.versity-s3.rule=Host(`s3.${SERVER_NAME}`)"
      - "traefik.http.routers.versity-s3.entrypoints=web"
      - "traefik.http.routers.versity-s3.service=versity-s3"

      # Public files: example.com/files/*
      - "traefik.http.routers.versity-files.rule=Host(`${SERVER_NAME}`) && PathPrefix(`/files`)"
      - "traefik.http.routers.versity-files.entrypoints=web"
      - "traefik.http.routers.versity-files.service=versity-s3"

      # WebGUI: example.com/storage/*
      - "traefik.http.routers.versity-ui.rule=Host(`${SERVER_NAME}`) && PathPrefix(`/storage`)"
      - "traefik.http.routers.versity-ui.entrypoints=web"
      - "traefik.http.routers.versity-ui.service=versity-ui"

      # Backend ports
      - "traefik.http.services.versity-ui.loadbalancer.server.port=8080"
      - "traefik.http.services.versity-s3.loadbalancer.server.port=7070"

