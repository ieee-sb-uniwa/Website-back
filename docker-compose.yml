services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    command:
      - "--log.level=INFO"
      - "--api.dashboard=true"
      # Set to false so we can secure it with a router/auth
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      # Entrypoints
      - "--entrypoints.web.address=:80"
    ports:
      - "8081:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/rawdata"]
      interval: 5s
      retries: 10
      start_period: 5s

  api:
    build: ./api
    restart: always
    container_name: bun-elysia-app
    env_file:
      - ./.env
    environment:
      - MONGODB_URL=mongodb://mongo:27017/${MONGO_DB_NAME}
      - MINIO_URL=http://${SERVER_NAME}/files
    command: ["bun", "run", "start"]
    # ports:
    #   - 8000:5000
    volumes:
      - ./db-container/data:/app/db/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=5000"
      - "traefik.http.routers.api.middlewares=strip-api-prefix"
      - "traefik.http.middlewares.strip-api-prefix.stripPrefix.prefixes=/api"
    develop:
      watch:
        - action: sync+restart
          path: ./api
          target: /app
        - action: rebuild
          path: ./api/package.json
        - action: rebuild
          path: ./api/bun.lockb
    depends_on:
      mongo:
        condition: service_started
      traefik:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:5000/ping"]
      interval: 5s
      retries: 5
      timeout: 3s
      start_period: 10s

  mongo:
    build:
      context: ./db-container
      args:
        - MONGO_DB_NAME=${MONGO_DB_NAME}
    container_name: mongo
    restart: always
    env_file:
      - ./.env
    volumes:
      - web-mongo-data:/data/db
    # ports:
    # - "27017:27017"

  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: minio
    command: server /data --console-address ":9001"
    env_file:
      - ./.env
    environment:
      - MINIO_BROWSER_REDIRECT_URL=http://${SERVER_NAME}/minio-console
    labels:
      - "traefik.enable=true"

      ## ➤ MinIO Console
      - "traefik.http.routers.minio-console.rule=PathPrefix(`/minio-console`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.routers.minio-console.service=minio-console-svc"
      - "traefik.http.services.minio-console-svc.loadbalancer.server.port=9001"
      - "traefik.http.routers.minio-console.middlewares=strip-minio-console-prefix"
      - "traefik.http.middlewares.strip-minio-console-prefix.stripPrefix.prefixes=/minio-console"

      ## ➤ MinIO S3 API
      - "traefik.http.routers.minio-api.rule=PathPrefix(`/files`)"
      - "traefik.http.routers.minio-api.entrypoints=web"
      - "traefik.http.routers.minio-api.service=minio-api-svc"
      - "traefik.http.services.minio-api-svc.loadbalancer.server.port=9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio-init:
    container_name: minio-init
    build:
      context: ./minio
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./.env
    develop:
      watch:
        - action: rebuild
          path: ./minio

  web:
    container_name: web
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: "http://api:5000"
        NEXT_PUBLIC_IMAGES_STORAGE_URL: "http://${SERVER_NAME}/files"
    env_file:
      - .env
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

volumes:
  minio-data:
    external: true
  web-mongo-data:
    external: true
