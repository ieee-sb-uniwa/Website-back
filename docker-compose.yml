services:

  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: always
    command:
      - '--api=true'
      - '--log.level=DEBUG'
      - '--api.dashboard=true'
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.exposedByDefault=false'
      - '--entrypoints.web.address=:8081'
    ports:
      - "8081:8081"
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/api/rawdata']
      interval: 5s
      retries: 10
      start_period: 5s

  api:
    build: ./api
    restart: always
    container_name: bun-elysia-app
    env_file:
      - ./.env
    # volumes:
    #   - ./db/data:/app/db/data
    working_dir: /app
    command: ['bun', 'run', 'start']
    ports:
      - 8000:5000
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=PathPrefix(`/api`)'
      - 'traefik.http.routers.api.entrypoints=web'
      - 'traefik.http.services.api.loadbalancer.server.port=5000'
      - 'traefik.http.routers.api.middlewares=strip-api-prefix'
      - 'traefik.http.middlewares.strip-api-prefix.stripPrefix.prefixes=/api'
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: sync+restart
          path: ./lib
          target: /app/lib
        - action: sync+restart
          path: ./db/services
          target: /app/db/services
        - action: sync+restart
          path: ./lib/elysia-endpoint-management
          target: /app/lib/elysia-endpoint-management
        - action: sync+restart
          path: ./db/mongoose_schemas
          target: /app/db/mongoose_schemas
        - action: rebuild
          path: package.json
    depends_on:
      mongo:
        condition: service_started
      traefik:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsSL', 'http://localhost:5000/ping']
      interval: 5s
      retries: 5
      timeout: 3s
      start_period: 10s

  mongo:
    build:
      context: ./api/db/container
    container_name: mongo
    restart: always
    env_file:
      - ./.env
    ports:
      - '27017:27017'

  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: minio
    command: server /data --console-address ":9001"
    env_file:
      - ./.env
    environment:
      - MINIO_BROWSER_REDIRECT_URL=http://$SERVER_URL/minio-console
    labels:
      - 'traefik.enable=true'

      ## ➤ MinIO Console at http://localhost:8081/minio-console
      - 'traefik.http.routers.minio-console.rule=PathPrefix(`/minio-console`)'
      - 'traefik.http.routers.minio-console.entrypoints=web'
      - 'traefik.http.routers.minio-console.middlewares=strip-minio-console-prefix'
      - 'traefik.http.routers.minio-console.service=minio-console-svc'
      - 'traefik.http.services.minio-console-svc.loadbalancer.server.port=9001'
      - 'traefik.http.middlewares.strip-minio-console-prefix.stripPrefix.prefixes=/minio-console'

      ## ➤ MinIO S3 API at http://localhost/files
      - 'traefik.http.routers.minio-api.rule=PathPrefix(`/files`)'
      - 'traefik.http.routers.minio-api.entrypoints=web'
      - 'traefik.http.routers.minio-api.service=minio-api-svc'
      - 'traefik.http.services.minio-api-svc.loadbalancer.server.port=9000'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set myminio http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing myminio/files &&
        mc cp --recursive /files/ myminio/files &&
        mc anonymous set-json /readonly-policy.json myminio/files;
        exit 0;
      "
    env_file:
      - ./.env
    volumes:
      - ./min-io/readonly-policy.json:/readonly-policy.json
      - ./min-io/files:/files
      
  web:
    container_name: web
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: "http://${SERVER_URL}/api"
        NEXT_PUBLIC_IMAGES_STORAGE_URL: "http://${SERVER_URL}/files"
    env_file:
      - .env
    restart: always
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.web.rule=PathPrefix(`/`)'
      - 'traefik.http.routers.web.entrypoints=web'
      - 'traefik.http.services.web.loadbalancer.server.port=3000'

volumes:
  minio-data:
    external: true
  web-mongo-data:
    external: true

